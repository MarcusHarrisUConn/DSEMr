name: R-CMD-check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release}
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: ubuntu-latest, r: oldrel-1}
    runs-on: ${{ matrix.config.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2

  rust:
    name: ${{ matrix.toolchain == 'stable' && 'rust' || 'rust-msrv' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, '1.71.0']
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Expand vendored dependencies
        run: |
          tar -xf rust/vendor.tar.xz
          mkdir -p .cargo
          cp rust/vendor-config.toml .cargo/config.toml
        working-directory: src
      - run: cargo fmt --manifest-path src/rust/Cargo.toml -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --offline --locked --all-targets -- -D warnings
        working-directory: src
      - run: LD_LIBRARY_PATH="$(R RHOME)/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" cargo test --manifest-path rust/Cargo.toml --offline --locked
        working-directory: src

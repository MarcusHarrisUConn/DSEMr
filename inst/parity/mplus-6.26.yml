  factor_innovation_variance: 1
required_semantics:
  - one time-invariant factor measured by four continuous indicators
  - first loading fixed to one and the other loadings estimated
  - factor mean and state intercept fixed to zero while indicator intercepts are free
  - time-invariant mutually independent indicator residuals
  - first-order autoregression on the latent factor
  - free factor innovation variance
  - missing indicators integrated through the latent-state sampler
  - Mplus-compatible treatment of the initial latent state
dsemr_status: implemented-experimental
implemented_components:
  - single-factor continuous N=1 FFBS and Gibbs reference sampler
  - marker-loading identification
  - zero factor-state intercept matching the Mplus location constraint
  - indicator intercepts, loadings, residual variances, and factor innovation variance
  - posterior latent-state storage and item-level missing observations
  - Rust-accelerated item sufficient statistics with an exact R reference path
  - deterministic independent chains
semantic_gaps:
  - exact Mplus improper default-prior mapping
  - documented match for the Mplus initial-state distribution
  - GIBBS(PX1) parameter-expansion behavior
  - DIC and pD calculation
  - fully native Rust latent-state sampler beyond sufficient-statistics acceleration
  - public output reports no parameter-level MCSE
acceptance:
  primary_rule: Posterior estimates must agree within two combined MCSEs after semantic parity is complete.
  blocker: The public Mplus output does not report parameter-level MCSE, so the primary rule is not yet evaluable.
  provisional_rule: DSEMr point estimates must fall inside the published Mplus intervals and its intervals must overlap them, with all differences and diagnostics reported.
